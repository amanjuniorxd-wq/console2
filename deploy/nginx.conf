# Frontend + API behind one origin. The console is a static build with a relative base, so it can live under any
# path; /mishrin-console/ is the Gyanagi mount point. The broker (API + scheduler) is a separate process.
server {
  listen 80;
  # ---- Frontend (npm run build → dist/) ----
  location /mishrin-console/ {
    alias /srv/mishrin-console/;
    try_files $uri $uri/ /mishrin-console/index.html;
    location ~* /mishrin-console/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /mishrin-console/sw.js { add_header Cache-Control "no-cache"; }
  }
  # ---- API + broker (server/broker.mjs). Set the console's Cloud endpoint to https://<host>/mishrin-api ----
  location /mishrin-api/ {
    proxy_pass http://broker:8787/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;          # worker allocate long-polls 25 s
    client_max_body_size 8m;         # 4 MiB upload chunks
  }
}
