<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline' blob: data:; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; form-action 'none'">
<style>html,body{margin:0;background:#000}</style>
</head><body><script>
// MPC web-package runner. Loaded in a sandboxed iframe (opaque origin) with a CSP that keeps the game off the
// network. The console posts the package HTML; it replaces this document but keeps this document's CSP.
addEventListener('message', function onPkg(e) {
  if (e.source !== parent || !e.data || typeof e.data.mpcPackage !== 'string') return;
  removeEventListener('message', onPkg);
  document.open(); document.write(e.data.mpcPackage); document.close();
});
parent.postMessage({ mpc: 'runner' }, '*');
</script></body></html>
